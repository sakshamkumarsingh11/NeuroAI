<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}TBI Speech Therapy{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="brand-icon">🧠</span>
      <div>
        <h1>TBI Speech Therapy</h1>
        <p class="tagline">AI-assisted rehabilitation</p>
      </div>
    </div>
    <nav>
      <a href="{{ url_for('index') }}">Patients</a>
    </nav>
  </header>
  <main class="app-main">
    {% block content %}{% endblock %}
  </main>
  <footer class="app-footer">
    <small>Research prototype — not a medical device.</small>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
